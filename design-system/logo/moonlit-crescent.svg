<?xml version="1.0" encoding="UTF-8"?>
<!-- moonlit.aura: Waning Crescent (D-016, D-044), sustraccion de dos
     circulos, iluminado desde la izquierda. Circulo A (disco lunar)
     centro (50,50) radio 36; circulo B (sombra) centro (62,46) radio 32,
     desplazado a la derecha y ligeramente arriba. Rasterizado por
     el subcomando de logotipo de generate.py (rsvg-convert mas supersampleo 16x
     mas filtro de caja, mismo pipeline que Material Symbols, D-033),
     nunca a mano en el firmware. No deriva de ningun icono existente. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <mask id="crescent">
    <circle cx="50" cy="50" r="36" fill="#ffffff"/>
    <circle cx="62" cy="46" r="32" fill="#000000"/>
  </mask>
  <rect x="0" y="0" width="100" height="100" fill="currentColor" mask="url(#crescent)"/>
</svg>
